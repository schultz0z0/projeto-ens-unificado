<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Button — Nexus ENS DS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="../components.css" />
  <style>
    body { padding: 48px; max-width: 980px; margin: 0 auto; }
    h1 { font: var(--type-h1); margin: 0 0 8px; }
    p.lead { font: var(--type-body-lg); color: hsl(var(--color-text-muted)); margin: 0 0 32px; }
    section { margin-bottom: 48px; }
    h2 { font: var(--type-h3); margin: 0 0 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .row.tone-dark { background: hsl(222 47% 11%); padding: 24px; border-radius: var(--radius-lg); }

    /* Button base */
    .btn { display: inline-flex; align-items: center; gap: 8px; font: 500 14px/1 var(--type-font-sans); padding: 0 18px; height: 40px; border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer; transition: transform var(--duration-fast) var(--ease-out-soft), background var(--duration-fast) var(--ease-out-soft), box-shadow var(--duration-fast) var(--ease-out-soft); }
    .btn:focus-visible { outline: 2px solid hsl(var(--color-ring)); outline-offset: 2px; }
    .btn svg { width: 16px; height: 16px; }
    .btn--primary { color: #fff; background: linear-gradient(135deg, hsl(189 100% 36%), hsl(189 90% 56%)); box-shadow: 0 12px 24px -12px rgba(0, 157, 183, 0.55), 0 4px 10px -4px rgba(11, 18, 32, 0.18); }
    .btn--primary:hover { transform: translateY(-1px); box-shadow: 0 16px 32px -14px rgba(0, 157, 183, 0.6), 0 6px 14px -6px rgba(11, 18, 32, 0.22); }
    .btn--secondary { color: hsl(var(--color-primary)); background: hsl(var(--color-secondary)); }
    .btn--secondary:hover { background: hsl(220 40% 92%); }
    .btn--tertiary { color: hsl(var(--color-text-primary)); background: transparent; border-color: hsl(var(--color-border)); }
    .btn--tertiary:hover { background: hsl(var(--color-muted)); }
    .btn--destructive { color: #fff; background: hsl(var(--color-destructive)); }
    .btn--destructive:hover { background: hsl(0 84% 54%); }
    .btn--ghost { color: hsl(var(--color-text-secondary)); background: transparent; }
    .btn--ghost:hover { background: hsl(var(--color-muted)); }
    .btn--sm { height: 32px; padding: 0 12px; font-size: 13px; }
    .btn--lg { height: 48px; padding: 0 24px; font-size: 16px; }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>
  <h1>Button</h1>
  <p class="lead">Ações principais, secundárias, terciárias, destrutivas e ghost. Suporta 3 tamanhos e estados disabled/loading.</p>

  <section>
    <h2>Variantes</h2>
    <div class="row">
      <button class="btn btn--primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Confirmar
      </button>
      <button class="btn btn--secondary">Salvar rascunho</button>
      <button class="btn btn--tertiary">Cancelar</button>
      <button class="btn btn--destructive">Excluir</button>
      <button class="btn btn--ghost">Saiba mais</button>
    </div>
  </section>

  <section>
    <h2>Tamanhos</h2>
    <div class="row">
      <button class="btn btn--primary btn--sm">Pequeno</button>
      <button class="btn btn--primary">Padrão</button>
      <button class="btn btn--primary btn--lg">Grande</button>
    </div>
  </section>

  <section>
    <h2>Estados</h2>
    <div class="row">
      <button class="btn btn--primary">Default</button>
      <button class="btn btn--primary" style="background: linear-gradient(135deg, hsl(189 100% 32%), hsl(189 90% 50%)); transform: translateY(-1px);">Hover</button>
      <button class="btn btn--primary" disabled>Disabled</button>
      <button class="btn btn--primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg>
        Enviando…
      </button>
    </div>
  </section>

  <section>
    <h2>Em superfície escura</h2>
    <div class="row tone-dark">
      <button class="btn btn--primary">Confirmar</button>
      <button class="btn btn--tertiary" style="color:#fff; border-color: hsla(0,0%,100%,0.2);">Cancelar</button>
      <button class="btn btn--ghost" style="color:#fff;">Ghost</button>
    </div>
  </section>

  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
