<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dialog — Nexus ENS DS</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="../components.css" />
  <style>
    body { padding: 48px 32px; max-width: 980px; margin: 0 auto; }
    h1 { font: var(--type-h1); margin: 0 0 8px; }
    p.lead { font: var(--type-body-lg); color: hsl(var(--color-text-muted)); margin: 0 0 32px; }
    h2 { font: var(--type-h3); margin: 40px 0 16px; }
    .stage { position: relative; min-height: 420px; background: hsl(220 60% 98%); border: 1px dashed hsl(var(--color-border)); border-radius: var(--radius-lg); padding: 24px; }
    .btn { display:inline-flex; align-items:center; font:500 14px/1 var(--type-font-sans); padding:0 16px; height:36px; border-radius:var(--radius-md); border:1px solid transparent; cursor:pointer; gap:6px; }
    .btn--primary { color:#fff; background: linear-gradient(135deg, hsl(189 100% 36%), hsl(189 90% 56%)); }
    .btn--tertiary { color: hsl(var(--color-text-primary)); background: hsl(var(--color-background)); border-color: hsl(var(--color-border)); }
    .btn--destructive { color:#fff; background: hsl(var(--color-destructive)); }
  </style>
</head>
<body>
  <h1>Dialog</h1>
  <p class="lead">Modal centralizado com overlay, header (título+descrição+close), body e footer. Substitui AlertDialog/Dialog do shadcn.</p>

  <h2>Exemplo: confirmar exclusão</h2>
  <div class="stage">
    <div class="nexus-dialog-overlay"></div>
    <div class="nexus-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-desc">
      <button class="nexus-dialog__close" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <header class="nexus-dialog__header">
        <h2 id="dlg-title" class="nexus-dialog__title">Excluir conversa?</h2>
        <p id="dlg-desc" class="nexus-dialog__desc">Esta ação não pode ser desfeita. Isso excluirá permanentemente o histórico desta conversa.</p>
      </header>
      <div class="nexus-dialog__body"></div>
      <footer class="nexus-dialog__footer">
        <button class="btn btn--tertiary">Cancelar</button>
        <button class="btn btn--destructive">Excluir</button>
      </footer>
    </div>
  </div>
</body>
</html>
